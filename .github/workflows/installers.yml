name: macOS installer checks

on:
  push:
    paths: ['scripts/**', 'tests/**', 'assets/hfx.*', 'src/**', 'vendor/**', 'Cargo.*', '.github/workflows/installers.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'assets/hfx.*', 'src/**', 'vendor/**', 'Cargo.*', '.github/workflows/installers.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native macOS executable
        run: cargo build --release --locked
      - name: Validate Bash syntax
        run: /bin/bash -n scripts/install-macos.sh scripts/uninstall-macos.sh scripts/macos-common.sh
      - name: Check macOS installer and native bundle
        run: python3 tests/macos_install.py target/release/hfx
